<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1A20" />
      <stop offset="100%" stop-color="#1A333D" />
    </linearGradient>

    <!-- Box Gradients -->
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>

    <linearGradient id="boxRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#CC6600" />
    </linearGradient>

    <linearGradient id="boxLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E67E22" />
      <stop offset="100%" stop-color="#B85B14" />
    </linearGradient>

    <!-- Signal Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="128" height="128" rx="28" fill="url(#bgGradFav)" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#00C6FF" stroke-width="2" stroke-opacity="0.3" />

  <!-- Tech Grid Circle -->
  <circle cx="64" cy="56" r="46" fill="none" stroke="#00C6FF" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4" />

  <!-- Isometric Cube / Material Box -->
  <g transform="translate(0, 6)">
    <!-- Top Face -->
    <polygon points="64,22 100,40 64,58 28,40" fill="url(#boxTop)" />
    <!-- Left Face -->
    <polygon points="28,40 64,58 64,92 28,74" fill="url(#boxLeft)" />
    <!-- Right Face -->
    <polygon points="64,58 100,40 100,74 64,92" fill="url(#boxRight)" />

    <!-- Signal Waves -->
    <path d="M 16,48 Q 64,24 112,48" fill="none" stroke="#00C6FF" stroke-width="7" stroke-linecap="round" filter="url(#cyanGlow)" />
    <path d="M 22,58 Q 64,36 106,58" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- RSI Badge -->
  <rect x="36" y="98" width="56" height="20" rx="6" fill="#00C6FF" />
  <text x="64" y="112" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" font-weight="900" font-size="12" fill="#0B1A20" text-anchor="middle" letter-spacing="1.5">RSI</text>
</svg>